<!DOCTYPE html>
<html lang="my">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ဘေဘီ့ ♥ မမ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Noto+Serif+Myanmar:wght@300;400;700&family=Great+Vibes&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

  <style>
    :root {
      --cream: #fdf6ee;
      --petal: #f7dcd0;
      --blush: #e8a598;
      --rose: #c96b6b;
      --wine: #7b2d3e;
      --dark: #1a0a10;
      --gold: #c9a96e;
      --gold2: #e8d5a3;
      --font-body: 'Noto Serif Myanmar', 'Cormorant Garamond', serif;
      --font-display: 'Great Vibes', cursive;
      --font-serif: 'Cormorant Garamond', serif;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--dark);
      color: var(--cream);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    /* ── STARFIELD ── */
    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── HERO ── */
    #hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 70% at 50% 60%, #4a1020 0%, #1a0a10 70%);
    }

    .hero-petals {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .petal {
      position: absolute;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      opacity: 0;
    }

    .hero-content {
      position: relative;
      text-align: center;
      z-index: 2;
      padding: 2rem 1.5rem;
      width: 100%;
      max-width: 700px;
    }

    .hero-subtitle {
      font-family: var(--font-serif);
      font-size: clamp(0.75rem, 2.5vw, 1.05rem);
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      transform: translateY(20px);
      margin-bottom: 1.2rem;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(3.5rem, 13vw, 9rem);
      color: var(--cream);
      line-height: 1;
      opacity: 0;
      transform: translateY(30px);
      text-shadow: 0 0 60px rgba(201, 107, 107, .5), 0 0 120px rgba(201, 107, 107, .2);
    }

    .hero-myanmar {
      font-family: var(--font-body);
      font-size: clamp(0.9rem, 3vw, 1.4rem);
      color: var(--petal);
      margin-top: 1.2rem;
      letter-spacing: 0.1em;
      opacity: 0;
      transform: translateY(20px);
    }

    .hero-line {
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 1.8rem auto;
    }

    .scroll-cue {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-serif);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-transform: uppercase;
    }

    .scroll-arrow {
      width: 1px;
      height: 36px;
      background: linear-gradient(180deg, var(--gold), transparent);
      animation: scrollPulse 2s ease-in-out infinite;
    }

    @keyframes scrollPulse {

      0%,
      100% {
        opacity: .3;
        transform: scaleY(1);
      }

      50% {
        opacity: 1;
        transform: scaleY(1.15);
      }
    }

    /* ── TIMELINE ── */
    #timeline {
      position: relative;
      z-index: 1;
      padding: 6rem 0 4rem;
    }

    .section-header {
      text-align: center;
      margin-bottom: 5rem;
      padding: 0 1.5rem;
    }

    .section-header h2 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      color: var(--cream);
      margin-bottom: 0.4rem;
    }

    .section-header p {
      font-family: var(--font-serif);
      font-size: 0.9rem;
      color: var(--gold);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    /* Desktop spine — center */
    .timeline-spine {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(180deg, transparent 0%, var(--wine) 8%, var(--wine) 92%, transparent 100%);
      transform: translateX(-50%);
    }

    /* Desktop letter block */
    .letter-block {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 80px 1fr;
      align-items: start;
      margin-bottom: 5rem;
      padding: 0 4%;
      opacity: 0;
      transform: translateY(50px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .letter-block.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .timeline-node {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 1.8rem;
    }

    .node-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--rose);
      border: 3px solid var(--dark);
      box-shadow: 0 0 0 2px var(--wine), 0 0 20px rgba(201, 107, 107, .6);
      position: relative;
      z-index: 2;
    }

    .node-month {
      font-family: var(--font-serif);
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      text-transform: uppercase;
      margin-top: 0.4rem;
      white-space: nowrap;
    }

    /* Card */
    .card {
      background: linear-gradient(135deg, rgba(122, 45, 62, .18) 0%, rgba(26, 10, 16, .7) 100%);
      border: 1px solid rgba(201, 107, 107, .2);
      border-radius: 3px;
      padding: 2rem 1.8rem 1.6rem;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px);
      transition: border-color .4s, box-shadow .4s, transform .4s;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--rose), transparent);
      opacity: .6;
    }

    .card:hover {
      border-color: rgba(201, 107, 107, .45);
      box-shadow: 0 12px 55px rgba(122, 45, 62, .35);
      transform: translateY(-3px);
    }

    .card-ornament {
      font-family: var(--font-display);
      font-size: 3.5rem;
      color: rgba(201, 107, 107, .1);
      position: absolute;
      top: .4rem;
      right: 1rem;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .card-month {
      font-family: var(--font-serif);
      font-size: .68rem;
      letter-spacing: .35em;
      color: var(--blush);
      text-transform: uppercase;
      margin-bottom: .7rem;
    }

    .card-heading {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 3.5vw, 2.1rem);
      color: var(--cream);
      margin-bottom: 1rem;
      line-height: 1.1;
    }

    .card-divider {
      width: 38px;
      height: 1px;
      background: linear-gradient(90deg, var(--gold), transparent);
      margin-bottom: 1rem;
    }

    .card-text {
      font-family: var(--font-body);
      font-size: clamp(.82rem, 1.8vw, .9rem);
      line-height: 2;
      color: rgba(253, 246, 238, .82);
      position: relative;
      z-index: 1;
    }

    .card-text p+p {
      margin-top: .85rem;
    }

    .card-closing {
      margin-top: 1.4rem;
      padding-top: 1.1rem;
      border-top: 1px solid rgba(201, 107, 107, .15);
      font-family: var(--font-serif);
      font-style: italic;
      font-size: .8rem;
      color: var(--blush);
      letter-spacing: .04em;
    }

    .card-signature {
      margin-top: .4rem;
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--gold);
    }

    /* ── COPY BUTTON ── */
    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      margin-top: 1.2rem;
      padding: .5rem 1.1rem;
      background: transparent;
      border: 1px solid rgba(201, 107, 107, .35);
      border-radius: 2rem;
      color: var(--blush);
      font-family: var(--font-serif);
      font-size: .75rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background .3s, border-color .3s, color .3s, transform .2s;
      position: relative;
      z-index: 2;
      /* Ensure touch targets are big enough */
      min-height: 40px;
      -webkit-tap-highlight-color: transparent;
    }

    .copy-btn svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
      transition: transform .3s;
    }

    .copy-btn:hover,
    .copy-btn:focus-visible {
      background: rgba(201, 107, 107, .12);
      border-color: rgba(201, 107, 107, .6);
      color: var(--cream);
      transform: translateY(-1px);
      outline: none;
    }

    .copy-btn:hover svg {
      transform: scale(1.15);
    }

    .copy-btn.copied {
      background: rgba(201, 107, 107, .2);
      border-color: var(--rose);
      color: var(--gold2);
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(122, 45, 62, .95);
      border: 1px solid rgba(201, 107, 107, .4);
      color: var(--cream);
      font-family: var(--font-serif);
      font-size: .82rem;
      letter-spacing: .1em;
      padding: .65rem 1.4rem;
      border-radius: 2rem;
      backdrop-filter: blur(10px);
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease, transform .3s ease;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── FLOATING HEARTS ── */
    .floating-heart {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      font-size: 1.1rem;
      opacity: 0;
      transform: translate(-50%, -50%);
    }

    /* ── CLOSING ── */
    #closing {
      position: relative;
      z-index: 1;
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 5rem 2rem;
      overflow: hidden;
    }

    .closing-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 50%, #4a1020 0%, #1a0a10 80%);
    }

    .closing-content {
      position: relative;
      z-index: 2;
    }

    .closing-eternity {
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 8vw, 6rem);
      color: var(--cream);
      margin-bottom: 1.8rem;
      text-shadow: 0 0 40px rgba(201, 107, 107, .4);
      opacity: 0;
      transform: scale(.85);
    }

    .closing-verse {
      font-family: var(--font-body);
      font-size: clamp(.88rem, 2.2vw, 1.05rem);
      color: var(--petal);
      line-height: 2.2;
      max-width: 480px;
      margin: 0 auto 2.2rem;
      opacity: 0;
      transform: translateY(20px);
    }

    .closing-hearts {
      font-size: 1.8rem;
      letter-spacing: .5rem;
      opacity: 0;
    }

    /* ══════════════════════════════════════
       MOBILE RESPONSIVE  ≤ 700px
    ══════════════════════════════════════ */
    @media (max-width: 700px) {

      /* Move spine to the left edge */
      .timeline-spine {
        left: 28px;
        transform: none;
      }

      /* Collapse to 2-col: thin spine col | card col */
      .letter-block {
        grid-template-columns: 56px 1fr;
        grid-template-rows: auto;
        padding: 0 1rem 0 0;
        margin-bottom: 2.5rem;
      }

      /* Always: node in col 1, card in col 2 — regardless of alternating */
      .letter-block .timeline-node {
        grid-column: 1 !important;
        grid-row: 1;
        padding-top: 1.5rem;
        align-items: center;
      }

      .letter-block .card {
        grid-column: 2 !important;
        grid-row: 1;
      }

      .letter-block .card-spacer {
        display: none !important;
      }

      .node-month {
        display: none;
      }

      .card {
        padding: 1.4rem 1.1rem 1.2rem;
      }

      .card-heading {
        font-size: 1.55rem;
      }

      .card-text {
        font-size: .84rem;
        line-height: 1.95;
      }

      .card-ornament {
        font-size: 2.6rem;
        top: .3rem;
        right: .7rem;
      }

      .copy-btn {
        font-size: .72rem;
        padding: .45rem .9rem;
      }

      .hero-content {
        padding: 2rem 1rem;
      }

      .section-header {
        margin-bottom: 3rem;
      }

      #timeline {
        padding: 4rem 0 3rem;
      }
    }

    @media (max-width: 420px) {
      .timeline-spine {
        left: 22px;
      }

      .letter-block {
        grid-template-columns: 44px 1fr;
      }

      .card {
        padding: 1.2rem .95rem;
      }
    }
  </style>
</head>

<body>

  <canvas id="starfield"></canvas>
  <div id="toast">♥ Copied to clipboard</div>

  <!-- HERO -->
  <section id="hero">
    <div class="hero-bg"></div>
    <div class="hero-petals" id="petals-container"></div>
    <div class="hero-content">
      <p class="hero-subtitle" id="hs1">A Collection of Letters</p>
      <h1 class="hero-title" id="ht1">Our Story</h1>
      <div class="hero-line" id="hl1"></div>
      <p class="hero-myanmar" id="hm1">ဘေဘီ့ ♥ မမ &nbsp;·&nbsp; တစ်လမှသည် ထာဝရ</p>
    </div>
    <div class="scroll-cue" id="scroll-cue">
      <span>Scroll</span>
      <div class="scroll-arrow"></div>
    </div>
  </section>

  <!-- TIMELINE -->
  <section id="timeline">
    <div class="timeline-spine"></div>
    <div class="section-header">
      <h2>Month by Month</h2>
      <p>ချစ်ခြင်းမေတ္တာ မှတ်တမ်း</p>
    </div>
    <div id="letters-container"></div>
  </section>

  <!-- CLOSING -->
  <section id="closing">
    <div class="closing-bg"></div>
    <div class="closing-content">
      <h2 class="closing-eternity" id="ce">Forever &amp; Beyond</h2>
      <p class="closing-verse" id="cv">
        နှစ်လ… သုံးလ… ငါးလ…<br />
        ခုနှစ်လ… ရှစ်လ… တစ်နှစ်…<br />
        တစ်သက်… ထာဝရ…<br />
        <em>သံသရာဘဝ အဆက်ဆက်</em>
      </p>
      <div class="closing-hearts" id="ch">♥ &nbsp; ♥ &nbsp; ♥</div>
    </div>
  </section>

  <script>
    // ════════════════════════════════════════════
    //  DATA  — full original text stored per letter
    // ════════════════════════════════════════════
    const letters = [
      {
        month: "1 Month", label: "Month One", title: "One Month",
        closing: "တစ်လမှသည် တစ်သက်… ထာဝရ… သံသရာဘဝအဆက်ဆက်",
        signature: "မမ့ကိုချစ်တဲ့ ဘေဘီ 😘🥰",

    // ════════════════════════════
    //  STARFIELD
    // ════════════════════════════
    (function () {
      const cv = document.getElementById('starfield');
      const ctx = cv.getContext('2d');
      let W, H, stars = [];
      function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
      function makeStars(n) {
        stars = [];
        for (let i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.2 + .2, a: Math.random(), sp: Math.random() * .003 + .001, ph: Math.random() * Math.PI * 2 });
      }
      let t = 0;
      (function draw() {
        ctx.clearRect(0, 0, W, H); t += .01;
        stars.forEach(s => {
          ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(253,246,238,${s.a * (.4 + .6 * Math.sin(t * s.sp * 60 + s.ph))})`;
          ctx.fill();
        });
        requestAnimationFrame(draw);
      })();
      window.addEventListener('resize', () => { resize(); makeStars(200); }); resize(); makeStars(200);
    })();

    function spawnPetals() {
      const wrap = document.getElementById('petals-container');
      const cols = ['#f7dcd0', '#e8a598', '#c96b6b', '#e8d5a3', '#fdf6ee'];
      function create() {
        const el = document.createElement('div'); el.className = 'petal';
        const sz = 8 + Math.random() * 14;
        el.style.cssText = `left:${Math.random() * 110 - 5}%;top:-30px;width:${sz}px;height:${sz * 1.5}px;background:${cols[Math.floor(Math.random() * cols.length)]};opacity:0;`;
        wrap.appendChild(el);
        anime({ targets: el, translateY: ['-30px', (window.innerHeight + 60) + 'px'], translateX: [0, (Math.random() - .5) * 180], rotate: [0, Math.random() * 720 - 360], opacity: [{ value: .7, duration: 400 }, { value: 0, duration: 600, delay: 1400 }], duration: 4500 + Math.random() * 3500, easing: 'linear', complete: () => { el.remove(); create(); } });
      }
      for (let i = 0; i < 16; i++) setTimeout(create, i * 300);
    }

    const ICON_COPY = `<svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;transition:transform .3s"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>`;
    const ICON_CHECK = `<svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg>`;

    // ════════════════════════════
    const lc = document.getElementById('letters-container');

    letters.forEach((letter, i) => {
      const block = document.createElement('div');
      block.className = 'letter-block';

      // Split on double newlines for paragraphs in the display text
      // We use the first chunk of text as display (trimmed paragraphs)
      const paraHTML = letter.full.split(/\n\n+/).map(p => `<p>${p.trim()}</p>`).join('');

      const cardHTML = `
    <div class="card">
      <div class="card-ornament">♥</div>
      <h3 class="card-heading">${letter.title}</h3>
      <div class="card-divider"></div>

      </button>
    </div>`;

      const nodeHTML = `
    <div class="timeline-node">
      <div class="node-dot"></div>
      <div class="node-month">${letter.month}</div>
    </div>`;

      const spacerHTML = `<div class="card-spacer"></div>`;

      // Even index → card on left; odd → card on right (desktop)
      block.innerHTML = (i % 2 === 0)
        ? cardHTML + nodeHTML + spacerHTML
        : spacerHTML + nodeHTML + cardHTML;

      lc.appendChild(block);

    // ════════════════════════════
    //  COPY BUTTON
    // ════════════════════════════
    document.addEventListener('click', e => {
      const btn = e.target.closest('.copy-btn');
      if (!btn) return;

      const letter = letters[+btn.dataset.idx];
      const text = `Happy ${letter.month} ပါမမ ♥\n\n${letter.full}\n\n${letter.closing}\n${letter.signature}`;

      const doSuccess = () => {
        btn.classList.add('copied');
        btn.innerHTML = `${ICON_CHECK}<span class="btn-label">Copied ♥</span>`;
        showToast('♥ Copied to clipboard');
        setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = `${ICON_COPY}<span class="btn-label">Copy Letter</span>`; }, 2600);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(doSuccess).catch(() => fallbackCopy(text, doSuccess));
      } else {
        fallbackCopy(text, doSuccess);
      }
    });

    function fallbackCopy(text, cb) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;pointer-events:none;';
      document.body.appendChild(ta); ta.focus(); ta.select();
      try { document.execCommand('copy'); cb(); } catch (e) { showToast('Press Ctrl+C / ⌘+C to copy'); }
      document.body.removeChild(ta);
    }

            .add({ targets: '#ce', opacity: [0, 1], scale: [.85, 1], duration: 1000 })
            .add({ targets: '#cv', opacity: [0, 1], translateY: [20, 0], duration: 900 }, '-=500')
            .add({ targets: '#ch', opacity: [0, 1], duration: 700 }, '-=300');
          clsObs.unobserve(e.target);
        }
      });
    }, { threshold: .3 });
    clsObs.observe(document.getElementById('closing'));

    const dotObs = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) { anime({ targets: e.target, scale: [0, 1.3, 1], opacity: [0, 1], duration: 600, easing: 'easeOutElastic(1,.5)' }); dotObs.unobserve(e.target); } });
    }, { threshold: .5 });
    document.querySelectorAll('.node-dot').forEach(d => dotObs.observe(d));

    // ════════════════════════════
    //  PARALLAX HERO
    // ════════════════════════════
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      const hc = document.querySelector('.hero-content');
      if (hc) { hc.style.transform = `translateY(${y * .35}px)`; hc.style.opacity = Math.max(0, 1 - y / 500); }
    }, { passive: true });

    // ════════════════════════════
    //  CURSOR TRAIL (desktop only)
    // ════════════════════════════
    if (window.matchMedia('(pointer:fine)').matches) {
      let lx = 0, ly = 0, th = 0;
      document.addEventListener('mousemove', e => {
        const now = Date.now(); if (now - th < 80) return; th = now;
        if (Math.hypot(e.clientX - lx, e.clientY - ly) < 20) return;
        lx = e.clientX; ly = e.clientY;
        const h = document.createElement('div'); h.className = 'floating-heart'; h.textContent = '♥';
        h.style.left = e.clientX + 'px'; h.style.top = e.clientY + 'px';
        h.style.color = `hsl(${340 + Math.random() * 30},70%,70%)`;
        document.body.appendChild(h);
        anime({ targets: h, translateY: [0, -(40 + Math.random() * 50)], translateX: [(Math.random() - .5) * 30], opacity: [1, 0], scale: [.6, 1.1, 0], duration: 1200 + Math.random() * 400, easing: 'easeOutCubic', complete: () => h.remove() });
      });
    }
  </script>
</body>

</html>
